name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # windows-latest only, deliberately. The whole input and window layer is
    # Win32 ctypes and the UI backend is WebView2 -- a Linux run would pass
    # while testing almost nothing that matters.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile every Python file
        run: python -m compileall -q main.py core tests tools build_exe.py

      - name: Check the frontend parses
        run: node --check ui/app.js

      - name: Unit tests
        run: python -m pytest tests/ -q

      - name: Catalog / API / DOM contract
        run: python tools/check_contract.py
